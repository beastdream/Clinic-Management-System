server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: clinic-management-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson Configuration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    serialization:
      write-dates-as-timestamps: false

  # SMTP gửi email (để trống MAIL_HOST -> chế độ dev: in link xác thực ra log)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Tên gửi trong lệnh EHLO; tên máy có dấu tiếng Việt sẽ bị Gmail từ chối
      mail.smtp.localhost: ${MAIL_SMTP_LOCALHOST:localhost}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Servlet Multipart
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Không kiểm tra kết nối SMTP trong health check (SMTP là tùy chọn ở môi trường dev)
management:
  health:
    mail:
      enabled: false

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:MediCare Clinic <no-reply@medicare-clinic.local>}
  email-verification:
    expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
    resend-cooldown-seconds: 60
  google:
    # OAuth 2.0 Client ID (Web application) tạo tại Google Cloud Console; để trống = tắt đăng nhập Google
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
